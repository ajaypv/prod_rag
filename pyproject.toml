[project]
name = "prodrag"
version = "0.1.0"
description = "Production-oriented RAG service using OCI GenAI and a local Qdrant store"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chonkie>=1.7.0,<2",
    "docling>=2.114.0,<3",
    "dramatiq[redis]>=2.2.0,<3",
    "fastapi>=0.139.2,<1",
    "langchain>=1.3.14,<2",
    "langchain-core>=1.2.22,<2",
    "langchain-oci>=0.3.1,<1",
    "langchain-qdrant>=1.1.0,<2",
    "numpy>=2.2.0,<3",
    "oci>=2.183.0,<3",
    "pydantic-settings>=2.10.0,<3",
    "python-multipart>=0.0.20,<1",
    "qdrant-client>=1.18.0,<2",
    "redis>=6.4.0,<8",
    "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1",
    "pytest>=8.4.0,<10",
    "pytest-cov>=6.2.0,<8",
    "ruff>=0.12.0,<1",
]

[project.scripts]
prodrag = "prodrag.cli:main"
prodrag-eval = "prodrag.evaluation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prodrag"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
